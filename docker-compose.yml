services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: library
      POSTGRES_PASSWORD: library
      POSTGRES_DB: library
    ports:
      # Только для локальной разработки (psql/DBeaver/тесты с хоста).
      # В docker-compose.prod.yml (шаг 8) наружу не пробрасывается.
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U library"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      # Точечно, а не всю ./app:/code/app — иначе bind mount перекрывает
      # app/static/{css/output.css,js/htmx.min.js}, собранные ВНУТРИ образа
      # (на хосте их либо нет, либо лежит протухшая версия из другой сборки).
      - ./app/main.py:/code/app/main.py
      - ./app/config.py:/code/app/config.py
      - ./app/database.py:/code/app/database.py
      - ./app/dependencies.py:/code/app/dependencies.py
      - ./app/timeutil.py:/code/app/timeutil.py
      - ./app/models:/code/app/models
      - ./app/routers:/code/app/routers
      - ./app/schemas:/code/app/schemas
      - ./app/services:/code/app/services
      - ./app/templates:/code/app/templates
      - ./alembic:/code/alembic
      - ./data/photos:/code/data/photos
    ports:
      - "8000:8000"
    environment:
      DEBUG: "true"
      DATABASE_URL: "postgresql+psycopg://library:library@db:5432/library"
      PHOTO_STORAGE_ROOT: "data/photos"
      # Из окружения хоста (или корневого .env, который docker compose читает
      # сам, отдельно от app/config.py) — реальный секрет в compose-файл не кладём.
      SETTINGS_ENCRYPTION_KEY: "${SETTINGS_ENCRYPTION_KEY:-}"
      SESSION_SECRET_KEY: "${SESSION_SECRET_KEY:-}"
      SHOWCASE_PUBLIC: "${SHOWCASE_PUBLIC:-true}"
      AI_EXTRACTION_DAILY_LIMIT: "${AI_EXTRACTION_DAILY_LIMIT:-30}"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
