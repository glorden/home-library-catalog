services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: library
      POSTGRES_PASSWORD: library
      POSTGRES_DB: library
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U library"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
    # Без command/--reload — используется CMD из Dockerfile (без reload),
    # это и есть безопасный прод-дефолт. Dev-режим (--reload) — в
    # docker-compose.override.yml, подхватывается автоматически локально.
    volumes:
      # Только постоянные данные. Dev-биндмаунты исходников — в
      # docker-compose.override.yml, не здесь: этот файл общий для
      # dev и прода, и volumes между -f файлами накапливаются, а не
      # заменяются (проверено на docker compose config) — то, что
      # попадёт сюда, никаким prod-оверлеем потом не уберётся.
      - ./data/photos:/code/data/photos
    environment:
      # false — безопасный дефолт (влияет на Secure-флаг session cookie,
      # см. app/security.py). Локально переопределяется на true в
      # docker-compose.override.yml.
      DEBUG: "false"
      DATABASE_URL: "postgresql+psycopg://library:library@db:5432/library"
      PHOTO_STORAGE_ROOT: "data/photos"
      # Из окружения хоста (или корневого .env, который docker compose читает
      # сам, отдельно от app/config.py) — реальный секрет в compose-файл не кладём.
      SETTINGS_ENCRYPTION_KEY: "${SETTINGS_ENCRYPTION_KEY:-}"
      SESSION_SECRET_KEY: "${SESSION_SECRET_KEY:-}"
      SHOWCASE_PUBLIC: "${SHOWCASE_PUBLIC:-true}"
      AI_EXTRACTION_DAILY_LIMIT: "${AI_EXTRACTION_DAILY_LIMIT:-30}"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
