services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: library
      POSTGRES_PASSWORD: library
      POSTGRES_DB: library
    ports:
      # Только для локальной разработки (psql/DBeaver/тесты с хоста).
      # В docker-compose.prod.yml (шаг 8) наружу не пробрасывается.
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U library"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./app:/code/app
      - ./alembic:/code/alembic
    ports:
      - "8000:8000"
    environment:
      DEBUG: "true"
      DATABASE_URL: "postgresql+psycopg://library:library@db:5432/library"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
