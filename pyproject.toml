[project]
name = "home-library-catalog"
version = "0.1.0"
description = "Open-source catalog for a home library with AI-assisted cataloging of paper books"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "jinja2>=3.1",
    "pydantic-settings>=2.6",
    "sqlmodel>=0.0.22",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "python-multipart>=0.0.12",
    "pillow>=11.0",
    "pillow-heif>=0.18",
    "anthropic>=0.40",
    "openai>=1.50",
    "httpx[socks]>=0.27",
    "cryptography>=43",
    "argon2-cffi>=23.1",
    "itsdangerous>=2.2",
    "typer>=0.13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
