# Прод-оверлей. Запускается явно:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
# docker-compose.override.yml (dev-порты/биндмаунты/--reload) в этот набор
# не входит и в проде не подхватывается.
services:
  db:
    restart: unless-stopped

  app:
    restart: unless-stopped
    environment:
      # Пусто по умолчанию — вызовы идут напрямую. Непусто только если прод
      # геолоцирован в стране, исключённой из supported-countries у
      # AI-вендора (см. DEPLOY.md, шаг 9); сервис ai-proxy ниже.
      AI_PROXY_URL: "${AI_PROXY_URL:-}"
    depends_on:
      - ai-proxy

  # SOCKS5-туннель наружу для вызовов Claude/Gemini — см. DEPLOY.md, шаг 9.
  # Ничего не публикует наружу (нет ports:), виден только сиблинг-контейнерам
  # по compose-сети. Секреты — в secrets/, не коммитятся (см. .gitignore).
  ai-proxy:
    build:
      context: docker/ai-proxy
    restart: unless-stopped
    environment:
      TUNNEL_SSH_HOST: "${AI_PROXY_SSH_HOST:?}"
      TUNNEL_SSH_USER: "${AI_PROXY_SSH_USER:-tunneluser}"
    volumes:
      - ./secrets/ai_proxy_id_ed25519:/keys/id_ed25519:ro
      - ./secrets/ai_proxy_known_hosts:/keys/known_hosts:ro

  caddy:
    build:
      context: docker/caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      # Сертификаты и ACME-состояние переживают рестарт/redeploy контейнера
      # без повторного запроса к Let's Encrypt.
      - caddy_data:/data
      - caddy_config:/config
      # Та же директория, что смонтирована в app (см. docker-compose.yml) —
      # сюда указывает X-Accel-Redirect из app/routers/media.py. Read-only:
      # Caddy только отдаёт файлы, не пишет.
      - ./data/photos:/data/photos:ro
    depends_on:
      - app

volumes:
  caddy_data:
  caddy_config:
