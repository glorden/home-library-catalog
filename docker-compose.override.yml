# Локальная разработка. Docker Compose подхватывает этот файл автоматически
# при голом `docker compose up` (без -f) — так работает `make dev`. В проде
# используется явный набор `-f docker-compose.yml -f docker-compose.prod.yml`,
# который этот файл не включает (см. DEPLOY.md), поэтому ничего отсюда в
# прод не попадает. Коммитится в git — секретов не содержит.
services:
  db:
    ports:
      # Только для локальной разработки (psql/DBeaver/тесты с хоста).
      - "5432:5432"

  app:
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      DEBUG: "true"
    volumes:
      # Точечно, а не всю ./app:/code/app — иначе bind mount перекрывает
      # app/static/{css/output.css,js/htmx.min.js}, собранные ВНУТРИ образа
      # (на хосте их либо нет, либо лежит протухшая версия из другой сборки).
      - ./app/main.py:/code/app/main.py
      - ./app/config.py:/code/app/config.py
      - ./app/database.py:/code/app/database.py
      - ./app/dependencies.py:/code/app/dependencies.py
      - ./app/timeutil.py:/code/app/timeutil.py
      - ./app/models:/code/app/models
      - ./app/routers:/code/app/routers
      - ./app/schemas:/code/app/schemas
      - ./app/services:/code/app/services
      - ./app/templates:/code/app/templates
      # PWA-ассеты (шаг 7) — реальные закоммиченные файлы, не build-артефакты
      # вроде output.css/htmx.min.js, поэтому монтируем точечно и их тоже:
      # правки sw.js/иконок/манифеста подхватываются без --build.
      - ./app/static/icons:/code/app/static/icons
      - ./app/static/manifest.json:/code/app/static/manifest.json
      - ./app/static/js/sw.js:/code/app/static/js/sw.js
      - ./alembic:/code/alembic
    ports:
      - "8000:8000"
