{% extends "base.html" %}
{% block content %}
<main class="mx-auto max-w-2xl p-6">
    <h1 class="mb-4 text-xl font-semibold">
        {{ "Редактировать издание" if edition else "Новое издание" }}
    </h1>
    <form method="post"
          action="{{ '/admin/editions/' ~ edition.id if edition else '/admin/editions' }}"
          class="space-y-3">
        <label class="block">
            <span class="text-sm text-gray-600">Название *</span>
            <input name="title" required value="{{ edition.title if edition else '' }}"
                   class="mt-1 w-full rounded border-gray-300">
        </label>
        <label class="block">
            <span class="text-sm text-gray-600">Подзаголовок</span>
            <input name="subtitle"
                   value="{{ edition.subtitle if edition and edition.subtitle is not none else '' }}"
                   class="mt-1 w-full rounded border-gray-300">
        </label>
        <label class="block">
            <span class="text-sm text-gray-600">Автор(ы)</span>
            <input name="authors"
                   value="{{ edition.authors if edition and edition.authors is not none else '' }}"
                   class="mt-1 w-full rounded border-gray-300">
        </label>
        <label class="block">
            <span class="text-sm text-gray-600">Издательство</span>
            <input name="publisher"
                   value="{{ edition.publisher if edition and edition.publisher is not none else '' }}"
                   class="mt-1 w-full rounded border-gray-300">
        </label>
        <div class="grid grid-cols-2 gap-3">
            <label class="block">
                <span class="text-sm text-gray-600">Год издания</span>
                <input name="publication_year" type="number"
                       value="{{ edition.publication_year if edition and edition.publication_year is not none else '' }}"
                       class="mt-1 w-full rounded border-gray-300">
            </label>
            <label class="block">
                <span class="text-sm text-gray-600">Год текстом (если неточно)</span>
                <input name="publication_year_text" placeholder="напр. 1930-е"
                       value="{{ edition.publication_year_text if edition and edition.publication_year_text is not none else '' }}"
                       class="mt-1 w-full rounded border-gray-300">
            </label>
        </div>
        <label class="block">
            <span class="text-sm text-gray-600">ISBN</span>
            <input name="isbn" value="{{ edition.isbn if edition and edition.isbn is not none else '' }}"
                   class="mt-1 w-full rounded border-gray-300">
        </label>
        <label class="block">
            <span class="text-sm text-gray-600">Язык</span>
            <input name="language"
                   value="{{ (edition.language if edition.language is not none else '') if edition else 'ru' }}"
                   class="mt-1 w-full rounded border-gray-300">
        </label>
        <label class="block">
            <span class="text-sm text-gray-600">Серия</span>
            <input name="series"
                   value="{{ edition.series if edition and edition.series is not none else '' }}"
                   class="mt-1 w-full rounded border-gray-300">
        </label>
        <label class="block">
            <span class="text-sm text-gray-600">Сведения об издании</span>
            <input name="edition_statement" placeholder="напр. 2-е изд., испр."
                   value="{{ edition.edition_statement if edition and edition.edition_statement is not none else '' }}"
                   class="mt-1 w-full rounded border-gray-300">
        </label>
        <label class="block">
            <span class="text-sm text-gray-600">Физическое описание</span>
            <input name="physical_description" placeholder="напр. 384 с.: ил."
                   value="{{ edition.physical_description if edition and edition.physical_description is not none else '' }}"
                   class="mt-1 w-full rounded border-gray-300">
        </label>
        <label class="block">
            <span class="text-sm text-gray-600">Заметки</span>
            <textarea name="description" rows="3"
                      class="mt-1 w-full rounded border-gray-300">{{ edition.description if edition and edition.description is not none else '' }}</textarea>
        </label>
        <div class="flex gap-2 pt-2">
            <button type="submit" class="rounded-lg bg-indigo-600 px-4 py-2 text-white hover:bg-indigo-700">
                Сохранить
            </button>
            <a href="{{ '/admin/editions/' ~ edition.id if edition else '/admin/editions' }}"
               class="rounded-lg px-4 py-2 text-gray-600 hover:bg-gray-100">
                Отмена
            </a>
        </div>
    </form>
</main>
{% endblock %}
