{% extends "base.html" %}
{% block content %}
<main class="mx-auto max-w-2xl p-6">
    <h1 class="mb-1 text-xl font-semibold">Настройки AI-провайдера</h1>
    <p class="mb-4 text-sm text-gray-500">
        Ключ хранится в базе в зашифрованном виде и никогда не отображается — при
        обновлении настроек оставьте поле ключа пустым, чтобы не менять его.
    </p>
    <form method="post" action="/admin/settings" class="space-y-3">
        <label class="block">
            <span class="text-sm text-gray-600">Провайдер</span>
            <select name="provider" class="mt-1 w-full rounded border-gray-300">
                <option value="claude" {% if not credentials or credentials.provider == "claude" %}selected{% endif %}>
                    Claude (Anthropic)
                </option>
                <option value="openai_compatible" {% if credentials and credentials.provider == "openai_compatible" %}selected{% endif %}>
                    OpenAI-совместимый (Groq, Gemini, локальные модели)
                </option>
            </select>
        </label>
        <label class="block">
            <span class="text-sm text-gray-600">Название (для себя)</span>
            <input name="display_name" required
                   value="{{ credentials.display_name if credentials and credentials.display_name is not none else '' }}"
                   class="mt-1 w-full rounded border-gray-300">
        </label>
        <label class="block">
            <span class="text-sm text-gray-600">API-ключ</span>
            <input name="api_key" type="password" autocomplete="off"
                   placeholder="{{ 'оставьте пустым, чтобы не менять' if credentials else '' }}"
                   class="mt-1 w-full rounded border-gray-300">
        </label>
        <label class="block">
            <span class="text-sm text-gray-600">Модель</span>
            <input name="model_name" required placeholder="claude-sonnet-5 / qwen/qwen3.6-27b / gemini-3-flash"
                   value="{{ credentials.model_name if credentials and credentials.model_name is not none else '' }}"
                   class="mt-1 w-full rounded border-gray-300">
        </label>
        <label class="block">
            <span class="text-sm text-gray-600">Base URL</span>
            <input name="base_url" placeholder="https://api.groq.com/openai/v1"
                   value="{{ credentials.base_url if credentials and credentials.base_url is not none else '' }}"
                   class="mt-1 w-full rounded border-gray-300">
            <span class="text-xs text-gray-400">
                Нужно только для «OpenAI-совместимый». Например Groq —
                https://api.groq.com/openai/v1, Gemini —
                https://generativelanguage.googleapis.com/v1beta/openai/
            </span>
        </label>
        <div class="flex gap-2 pt-2">
            <button type="submit" class="rounded-lg bg-indigo-600 px-4 py-2 text-white hover:bg-indigo-700">
                Сохранить
            </button>
            <a href="/admin/editions" class="rounded-lg px-4 py-2 text-gray-600 hover:bg-gray-100">
                Отмена
            </a>
        </div>
    </form>
</main>
{% endblock %}
