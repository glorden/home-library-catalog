<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>{% block title %}Каталог домашней библиотеки{% endblock %}</title>
    <link rel="manifest" href="/static/manifest.json">
    <link rel="icon" href="/static/icons/favicon.ico">
    <link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">
    <meta name="theme-color" content="#4f46e5">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Библиотека">
    <link rel="stylesheet" href="/static/css/output.css">
    <script src="/static/js/htmx.min.js" defer></script>
</head>
<body class="min-h-screen bg-gray-50 text-gray-900">
    <nav class="flex items-center justify-between border-b bg-white px-6 py-3 text-sm">
        <a href="/" class="font-medium text-gray-900 hover:underline">Каталог домашней библиотеки</a>
        {% if request.state.user %}
        <div class="flex items-center gap-3">
            <a href="/admin/editions" class="text-gray-600 hover:underline">Админ</a>
            <form method="post" action="/logout">
                <button type="submit" class="text-gray-600 hover:underline">Выйти</button>
            </form>
        </div>
        {% else %}
        <a href="/login" class="text-gray-600 hover:underline">Войти</a>
        {% endif %}
    </nav>
    {% block content %}{% endblock %}
    <script>
        if ("serviceWorker" in navigator) {
            window.addEventListener("load", () => {
                navigator.serviceWorker.register("/sw.js");
            });
        }
    </script>
</body>
</html>
