{% extends "base.html" %}
{% block content %}
<main class="flex min-h-screen flex-col items-center justify-center gap-4 p-6 text-center">
    <h1 class="text-2xl font-semibold">Каталог домашней библиотеки</h1>
    <p class="text-gray-600">Каркас проекта: FastAPI + Jinja2 + htmx + Tailwind.</p>
    <button
        class="rounded-lg bg-indigo-600 px-4 py-2 text-white hover:bg-indigo-700"
        hx-get="/partials/greeting"
        hx-target="#greeting"
        hx-swap="innerHTML"
    >
        Проверить связь
    </button>
    <div id="greeting"></div>
</main>
{% endblock %}
