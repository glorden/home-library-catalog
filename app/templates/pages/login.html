{% extends "base.html" %}
{% block title %}Вход — Каталог домашней библиотеки{% endblock %}
{% block content %}
<main class="mx-auto flex min-h-screen max-w-sm flex-col justify-center p-6">
    <h1 class="mb-4 text-xl font-semibold">Вход</h1>
    {% if error %}
    <p class="mb-3 rounded bg-red-50 px-3 py-2 text-sm text-red-700">{{ error }}</p>
    {% endif %}
    <form method="post" action="/login" class="space-y-3">
        <label class="block">
            <span class="text-sm text-gray-600">Email</span>
            <input name="email" type="email" required autofocus
                   class="mt-1 w-full rounded border-gray-300">
        </label>
        <label class="block">
            <span class="text-sm text-gray-600">Пароль</span>
            <input name="password" type="password" required
                   class="mt-1 w-full rounded border-gray-300">
        </label>
        <button type="submit" class="w-full rounded-lg bg-indigo-600 px-4 py-2 text-white hover:bg-indigo-700">
            Войти
        </button>
    </form>
</main>
{% endblock %}
