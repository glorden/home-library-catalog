{% extends "base.html" %}
{% block title %}Нет соединения — Каталог домашней библиотеки{% endblock %}
{% block content %}
<main class="mx-auto flex max-w-3xl flex-col items-center gap-4 p-6 text-center">
    <h1 class="text-2xl font-semibold">Нет соединения</h1>
    <p class="text-gray-500">
        Не удалось связаться с сервером. Проверьте подключение к интернету
        и попробуйте ещё раз.
    </p>
    <button type="button" onclick="location.reload()"
            class="rounded-lg bg-indigo-600 px-4 py-2 text-white hover:bg-indigo-700">
        Обновить
    </button>
</main>
{% endblock %}
